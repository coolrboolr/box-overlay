<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Memory Search</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        color-scheme: light dark;
        font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      }
      body {
        margin: 0;
        padding: 12px;
        width: 360px;
        min-height: 420px;
        background: #0f172a0d;
      }
      h1 {
        font-size: 16px;
        margin: 0 0 8px;
      }
      form {
        display: flex;
        gap: 8px;
        margin-bottom: 8px;
      }
      input[type="text"] {
        flex: 1;
        padding: 8px;
        border-radius: 8px;
        border: 1px solid #cbd5f5;
        font: inherit;
      }
      button {
        font: inherit;
        border-radius: 8px;
        border: none;
        padding: 8px 12px;
        cursor: pointer;
        background: #0f172a;
        color: #fff;
      }
      button.secondary {
        background: #e5e7eb;
        color: #1f2937;
      }
      button.active {
        background: #2563eb;
        color: white;
      }
      .filters {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-bottom: 8px;
      }
      .filter-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .chip {
        background: #e0f2fe;
        color: #0f172a;
        padding: 4px 8px;
        border-radius: 999px;
        font-size: 11px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .chip button {
        border: none;
        background: transparent;
        color: inherit;
        cursor: pointer;
        padding: 0;
        font-size: 12px;
      }
      select.secondary {
        background: #e5e7eb;
        color: #1f2937;
        border: 1px solid #cbd5f5;
        padding: 8px 10px;
        border-radius: 8px;
      }
      .tabs {
        display: flex;
        gap: 6px;
        margin-bottom: 10px;
      }
      .tabs button {
        flex: 1;
      }
      #status {
        font-size: 13px;
        color: #475569;
        min-height: 18px;
        margin-bottom: 6px;
      }
      #error {
        font-size: 13px;
        color: #dc2626;
        min-height: 18px;
      }
      #answer {
        background: #f5f6ff;
        border-radius: 10px;
        padding: 10px;
        margin-bottom: 10px;
      }
      #answer h2 {
        font-size: 14px;
        margin: 0 0 6px;
      }
      #answer p {
        margin: 0 0 6px;
      }
      #answer ul {
        padding-left: 16px;
        margin: 0;
        font-size: 12px;
      }
      #answer .muted {
        color: #475569;
        font-size: 12px;
        margin: 4px 0 0;
      }
      .source-chip {
        background: #eef2ff;
        color: #1e293b;
        border-radius: 999px;
        padding: 4px 10px;
        font-size: 11px;
        border: 1px solid #cbd5f5;
        cursor: pointer;
      }
      .source-chip:hover {
        background: #e0e7ff;
      }
      #results {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin: 0;
      }
      .result {
        background: #fff;
        border-radius: 10px;
        padding: 10px;
        box-shadow: 0 2px 6px rgba(15, 23, 42, 0.08);
      }
      .result.focused {
        outline: 2px solid #2563eb;
        outline-offset: 2px;
      }
      .result h3 {
        font-size: 14px;
        margin: 0 0 4px;
      }
      .result p {
        margin: 0 0 6px;
        font-size: 13px;
      }
      .meta {
        color: #6b7280;
        font-size: 12px;
      }
      .actions {
        display: flex;
        gap: 8px;
      }
      .actions button {
        flex: 1 1 auto;
        font-size: 12px;
      }
      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin: 4px 0;
      }
      .tag-chip {
        background: #e0f2fe;
        color: #0f172a;
        padding: 2px 6px;
        border-radius: 6px;
        font-size: 11px;
      }
      .note {
        font-size: 12px;
        color: #111827;
        background: #f8fafc;
        padding: 6px;
        border-radius: 6px;
        margin-bottom: 6px;
      }
      #chat-log {
        display: flex;
        flex-direction: column;
        gap: 8px;
        max-height: 260px;
        overflow-y: auto;
        margin-bottom: 10px;
      }
      .bubble {
        padding: 10px;
        border-radius: 10px;
        white-space: pre-wrap;
        font-size: 13px;
      }
      .bubble.user {
        background: #e0f2fe;
        align-self: flex-end;
      }
      .bubble.assistant {
        background: #f5f6ff;
        border: 1px solid #cbd5f5;
      }
    </style>
  </head>
  <body>
    <div class="tabs">
      <button id="tab-search" class="active" type="button">Search</button>
      <button id="tab-chat" type="button">Chat</button>
    </div>

    <section id="search-view">
      <h1>Search Memory</h1>
      <form id="query-form">
        <input id="query-input" type="text" placeholder="e.g. async React article" />
        <button id="search-button" type="submit">Search</button>
      </form>
      <div class="filters">
        <div class="filter-row">
          <button id="filter-domain" type="button" class="secondary">This domain</button>
          <button id="filter-add-domain" type="button" class="secondary">Add domain</button>
          <select id="filter-range" class="secondary">
            <option value="">Any time</option>
            <option value="7">Past 7 days</option>
            <option value="30">Past 30 days</option>
            <option value="90">Past 90 days</option>
          </select>
          <select id="topk-select" class="secondary">
            <option value="3">Top 3</option>
            <option value="5" selected>Top 5</option>
            <option value="8">Top 8</option>
          </select>
        </div>
        <div class="filter-row chips" id="domain-chips"></div>
        <div class="filter-row">
          <button id="filter-tags" type="button" class="secondary">Tag filter</button>
          <button id="filter-entity" type="button" class="secondary">All entities</button>
          <button id="filter-concept" type="button" class="secondary">Concept filter</button>
        </div>
        <div class="filter-row chips" id="tag-chips"></div>
      </div>
      <div id="status"></div>
      <div id="error"></div>
      <section id="answer" hidden>
        <h2>Answer</h2>
        <p id="answer-text"></p>
        <p id="answer-note" class="muted"></p>
        <div id="answer-sources" class="chips"></div>
      </section>
      <section id="results"></section>
    </section>

    <section id="chat-view" hidden>
      <h1>Memory Chat</h1>
      <div id="chat-log"></div>
      <form id="chat-form">
        <input id="chat-input" type="text" placeholder="Ask a follow-up..." />
        <button id="chat-send" type="submit">Send</button>
      </form>
      <div class="filters">
        <button id="chat-reset" type="button" class="secondary">Reset conversation</button>
      </div>
    </section>
    <script type="module" src="dist/popup.js"></script>
  </body>
</html>
